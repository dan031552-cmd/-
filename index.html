<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashkenazi Shirts - חולצות מודפסות איכותיות</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: rgba(18, 28, 56, 0.85);
            --primary: #00d2ff;
            --primary-hover: #00b8e6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(11, 19, 41, 0.8);
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease;
        }

        body.gold-mode {
            --primary: #f59e0b;
            --primary-hover: #d97706;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            font-weight: 900;
            font-size: 2.8rem;
            margin: 0;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 1.1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* טופס */
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            font-weight: 700;
            font-size: 0.95rem;
            color: #ffffff;
        }

        input, select, textarea {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            background-color: var(--input-bg) !important;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #ffffff !important;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            box-sizing: border-box;
        }

        textarea {
            height: auto;
            padding: 10px 14px;
        }

        select option, select optgroup {
            background-color: #0b1329 !important;
            color: #ffffff !important;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.3);
        }

        .option-toggle {
            display: flex;
            gap: 10px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 700;
            text-align: center;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: var(--primary);
            color: #000000;
            border-color: var(--primary);
            font-weight: 900;
        }

        .coupon-wrapper {
            display: flex;
            gap: 10px;
        }

        .btn-coupon {
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-coupon:hover {
            background: var(--primary);
            color: #000000;
        }

        .price-box {
            background: var(--input-bg);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 900;
        }

        .price-amount {
            color: #00e676;
            font-size: 1.4rem;
        }

        .btn-order {
            width: 100%;
            padding: 14px;
            background: #00e676;
            color: #000000;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background-color 0.3s;
        }

        .btn-order:hover {
            background: #00c853;
            transform: translateY(-2px);
        }

        /* גלריה */
        .gallery-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .main-image {
            width: 100%;
            height: 380px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: #1e293b;
        }

        .thumbnails {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .thumb {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.6;
            transition: all 0.3s;
        }

        .thumb.active, .thumb:hover {
            opacity: 1;
            border-color: var(--primary);
        }

        /* ביקורות ומודאלים */
        .reviews-container {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .review-lock-msg {
            color: #f59e0b;
            font-size: 0.85rem;
            background: rgba(245, 158, 11, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .reviews-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: #121c38;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-action {
            padding: 10px 18px;
            background: var(--primary);
            border: none;
            color: #000;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Ashkenazi Shirts</h1>
            <div class="subtitle">חולצות דרייפיט וטריקו בגרפיקה והדפסה איכותית</div>
        </header>

        <div class="main-content">
            <!-- טופס להזמנה -->
            <div class="form-section">
                
                <div class="form-group">
                    <label>שם מלא *</label>
                    <input type="text" id="cust-name" placeholder="הכנס שם מלא">
                </div>

                <div class="form-group">
                    <label>אופן אספקה</label>
                    <div class="option-toggle">
                        <div class="toggle-btn active" id="btn-pickup" onclick="setDelivery('pickup')">איסוף עצמי</div>
                        <div class="toggle-btn" id="btn-shipping" onclick="setDelivery('shipping')">משלוח (35 ₪)</div>
                    </div>
                </div>

                <div class="form-group" id="address-group" style="display: none;">
                    <label>כתובת למשלוח *</label>
                    <input type="text" id="cust-address" placeholder="עיר, רחוב ומספר בית">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="color">צבע חולצה</label>
                        <select id="color">
                            <option value="שחור">שחור</option>
                            <option value="לבן">לבן</option>
                            <option value="כחול נייבי">כחול נייבי</option>
                            <option value="אפור עכבר">אפור עכבר</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="size">מידה</label>
                        <select id="size">
                            <optgroup label="מידות אותיות">
                                <option value="S">S</option>
                                <option value="M" selected>M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                            </optgroup>
                            <optgroup label="מידות במספרים (1-47)" id="numeric-sizes">
                                <!-- נטען אוטומטית 1 עד 47 -->
                            </optgroup>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>סוג הדפסה</label>
                    <div class="option-toggle">
                        <div class="toggle-btn active" id="btn-print-front" onclick="setPrintType('front')">קדמית בלבד</div>
                        <div class="toggle-btn" id="btn-print-back" onclick="openBackPrintModal()">קדמית + גב (+15 ₪)</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="qty">כמות</label>
                        <input type="number" id="qty" value="1" min="1" onchange="calculateTotal()">
                    </div>

                    <div class="form-group">
                        <label>קוד קופון</label>
                        <div class="coupon-wrapper">
                            <input type="text" id="coupon-code" placeholder="קוד">
                            <button class="btn-coupon" onclick="applyCoupon()">הפעל</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>הערות להזמנה</label>
                    <textarea id="notes" rows="2" placeholder="דגשים מיוחדים, כיתוב רצוי וכו'"></textarea>
                </div>

                <div class="price-box">
                    <span>סה"כ לתשלום:</span>
                    <span class="price-amount" id="total">55 ₪</span>
                </div>

                <button class="btn-order" onclick="order()">
                    <span>שלח הזמנה בוואטסאפ</span>
                    <span>✅</span>
                </button>

            </div>

            <!-- גלריה בצד -->
            <div class="gallery-container">
                <img id="main-img" src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=800" class="main-image" alt="חולצה">
                <div class="thumbnails">
                    <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=800" class="thumb active" onclick="changeImage(this)">
                    <img src="https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=800" class="thumb" onclick="changeImage(this)">
                    <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=800" class="thumb" onclick="changeImage(this)">
                </div>
            </div>
        </div>

        <!-- אזור ביקורות -->
        <div class="reviews-container">
            <div class="review-lock-msg" id="review-lock-msg">🔒 כתיבת ביקורת מתאפשרת רק ללקוחות שביצעו הזמנה</div>
            <button class="btn-action" id="btn-open-review-modal" style="display: none;" onclick="openReviewModal()">✍️ הוסף ביקורת</button>
            <div class="reviews-title">💬 ביקורות לקוחות</div>
        </div>

    </div>

    <!-- מודאל הדפסה על הגב -->
    <div class="modal-overlay" id="back-print-modal">
        <div class="modal">
            <h3>הדפסה על הגב (+15 ₪)</h3>
            <p style="color: var(--text-muted); margin: 0;">מה תרצה להדפיס על גב החולצה?</p>
            <textarea id="back-print-text" rows="3" placeholder="כתיבת טקסט, מספר, או תיאור סמל..."></textarea>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-coupon" onclick="closeBackPrintModal(false)">ביטול</button>
                <button class="btn-action" onclick="closeBackPrintModal(true)">אישור</button>
            </div>
        </div>
    </div>

    <!-- מודאל הוספת ביקורת -->
    <div class="modal-overlay" id="add-review-modal">
        <div class="modal">
            <h3>הוסף ביקורת</h3>
            <div class="form-group">
                <label>שמך (יוצג בביקורת)</label>
                <input type="text" id="review-name-input" placeholder="ישראל ישראלי">
            </div>
            <div class="form-group">
                <label>דירוג</label>
                <select id="review-rating-select">
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                    <option value="3">⭐⭐⭐ (3/5)</option>
                </select>
            </div>
            <div class="form-group">
                <label>תוכן הביקורת</label>
                <textarea id="review-text-input" rows="3" placeholder="איך הייתה החולצה?"></textarea>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-coupon" onclick="closeReviewModal()">ביטול</button>
                <button class="btn-action" onclick="submitReview()">פרסם</button>
            </div>
        </div>
    </div>

    <script>
        const PHONE_NUMBER = "972500000000";
        const FIREBASE_DB_URL = "https://ashkenazi-shirts-default-rtdb.firebaseio.com/";

        let basePrice = 55;
        let printExtra = 0;
        let shippingExtra = 0;
        let discount = 0;
        let deliveryMethod = 'pickup';
        let printType = 'front';
        let backPrintDetails = '';

        window.onload = function() {
            populateNumericSizes();
            checkUserOrderPermission();
        };

        function populateNumericSizes() {
            const container = document.getElementById('numeric-sizes');
            for (let i = 1; i <= 47; i++) {
                let opt = document.createElement('option');
                opt.value = i.toString();
                opt.textContent = i;
                container.appendChild(opt);
            }
        }

        function changeImage(el) {
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('main-img').src = el.src;
        }

        function setDelivery(method) {
            deliveryMethod = method;
            document.getElementById('btn-pickup').classList.toggle('active', method === 'pickup');
            document.getElementById('btn-shipping').classList.toggle('active', method === 'shipping');
            
            let addressGroup = document.getElementById('address-group');
            if (method === 'shipping') {
                addressGroup.style.display = 'flex';
                shippingExtra = 35;
            } else {
                addressGroup.style.display = 'none';
                shippingExtra = 0;
            }
            calculateTotal();
        }

        function setPrintType(type) {
            printType = type;
            document.getElementById('btn-print-front').classList.toggle('active', type === 'front');
            document.getElementById('btn-print-back').classList.toggle('active', type === 'back');

            if (type === 'front') {
                printExtra = 0;
                backPrintDetails = '';
            }
            calculateTotal();
        }

        function openBackPrintModal() {
            document.getElementById('back-print-modal').classList.add('open');
        }

        function closeBackPrintModal(save) {
            if (save) {
                let text = document.getElementById('back-print-text').value.trim();
                if (!text) {
                    alert('אנא הזן פירוט להדפסה על הגב');
                    return;
                }
                backPrintDetails = text;
                printExtra = 15;
                setPrintType('back');
            } else {
                if (!backPrintDetails) {
                    setPrintType('front');
                }
            }
            document.getElementById('back-print-modal').classList.remove('open');
            calculateTotal();
        }

        function applyCoupon() {
            let code = document.getElementById('coupon-code').value.trim();
            if (code === '2324') {
                discount = 10;
                document.body.classList.add('gold-mode');
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                alert('🎁 קוד קופון הופעל בהצלחה! קיבלת 10 ₪ הנחה!');
            } else {
                alert('קוד קופון לא תקין');
                discount = 0;
                document.body.classList.remove('gold-mode');
            }
            calculateTotal();
        }

        function calculateTotal() {
            let qty = parseInt(document.getElementById('qty').value) || 1;
            let singlePrice = basePrice + printExtra;
            let total = (singlePrice * qty) + shippingExtra - discount;
            if (total < 0) total = 0;
            docum
