<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashkenazi Shirts - חולצות מודפסות איכותיות</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti for Coupon Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --border-color: rgba(255, 255, 255, 0.2);
            --gold-primary: #f59e0b;
            --gold-border: rgba(245, 158, 11, 0.5);
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease;
        }

        /* Gold Mode Theme Override */
        body.gold-mode {
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --accent: #fbbf24;
            --border-color: var(--gold-border);
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            font-weight: 900;
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, #a5b4fc, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.gold-mode h1 {
            background: linear-gradient(135deg, #fef3c7, #f59e0b, #b45309);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 1.1rem;
        }

        /* Layout Grid */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* Gallery Section */
        .gallery-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .main-image {
            width: 100%;
            height: 350px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: #1e293b;
        }

        .thumbnails {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .thumb {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.6;
            transition: all 0.3s;
        }

        .thumb.active, .thumb:hover {
            opacity: 1;
            border-color: var(--primary);
        }

        /* Form Section */
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            font-weight: 700;
            font-size: 1rem;
            color: #ffffff;
        }

        /* תיקון מלא וקריטי לרשימות הנפתחות ולתיבות הקלט */
        input, select, textarea {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            background-color: #0f172a !important;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #ffffff !important;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            box-sizing: border-box;
            cursor: pointer;
            position: relative;
            z-index: 10;
        }

        textarea {
            height: auto;
            padding: 12px 16px;
        }

        /* וידוא שהאופציות בתוך ה-Select פתוחות ונגישות לחלוטין */
        select option {
            background-color: #0f172a !important;
            color: #ffffff !important;
            padding: 12px;
            font-size: 1.05rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
        }

        .option-toggle {
            display: flex;
            gap: 10px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 700;
            text-align: center;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Coupon Section */
        .coupon-wrapper {
            display: flex;
            gap: 10px;
        }

        .btn-coupon {
            padding: 0 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-coupon:hover {
            background: var(--primary);
        }

        /* Price display */
        .price-box {
            background: rgba(15, 23, 42, 0.8);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.3rem;
            font-weight: 900;
        }

        .price-amount {
            color: #4ade80;
            font-size: 1.6rem;
        }

        .btn-order {
            width: 100%;
            padding: 16px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, background-color 0.3s;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
        }

        .btn-order:hover {
            background: #22c55e;
            transform: translateY(-2px);
        }

        /* Modal Back Print */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Reviews Section */
        .reviews-container {
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
            margin-top: 10px;
        }

        .reviews-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-review-add {
            padding: 10px 18px;
            background: var(--primary);
            border: none;
            color: white;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .review-lock-msg {
            color: #f59e0b;
            font-size: 0.9rem;
            background: rgba(245, 158, 11, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .review-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .review-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .review-author {
            font-weight: 700;
            color: white;
        }

        .review-stars {
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Ashkenazi Shirts</h1>
            <div class="subtitle">חולצות דרייפיט וטריקו בגרפיקה והדפסה איכותית</div>
        </header>

        <div class="main-content">
            <!-- גלריית תמונות -->
            <div class="gallery-container">
                <img id="main-img" src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=800" class="main-image" alt="חולצה מודפסת">
                <div class="thumbnails">
                    <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=800" class="thumb active" onclick="changeImage(this)">
                    <img src="https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=800" class="thumb" onclick="changeImage(this)">
                    <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=800" class="thumb" onclick="changeImage(this)">
                </div>
            </div>

            <!-- טופס הזמנה -->
            <div class="form-section">
                
                <div class="form-group">
                    <label>שם מלא *</label>
                    <input type="text" id="cust-name" placeholder="הכנס שם מלא">
                </div>

                <div class="form-group">
                    <label>אופן אספקה</label>
                    <div class="option-toggle">
                        <div class="toggle-btn active" id="btn-pickup" onclick="setDelivery('pickup')">איסוף עצמי</div>
                        <div class="toggle-btn" id="btn-shipping" onclick="setDelivery('shipping')">משלוח (35 ₪)</div>
                    </div>
                </div>

                <div class="form-group" id="address-group" style="display: none;">
                    <label>כתובת למשלוח *</label>
                    <input type="text" id="cust-address" placeholder="עיר, רחוב ומספר בית">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="color">צבע חולצה</label>
                        <select id="color">
                            <option value="שחור">שחור</option>
                            <option value="לבן">לבן</option>
                            <option value="כחול נייבי">כחול נייבי</option>
                            <option value="אפור עכבר">אפור עכבר</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="size">מידה</label>
                        <select id="size">
                            <option value="S">S</option>
                            <option value="M" selected>M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>סוג הדפסה</label>
                    <div class="option-toggle">
                        <div class="toggle-btn active" id="btn-print-front" onclick="setPrintType('front')">קדמית בלבד</div>
                        <div class="toggle-btn" id="btn-print-back" onclick="openBackPrintModal()">קדמית + גב (+15 ₪)</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="qty">כמות</label>
                        <input type="number" id="qty" value="1" min="1" onchange="calculateTotal()">
                    </div>

                    <div class="form-group">
                        <label>קוד קופון</label>
                        <div class="coupon-wrapper">
                            <input type="text" id="coupon-code" placeholder="קוד">
                            <button class="btn-coupon" onclick="applyCoupon()">הפעל</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>הערות להזמנה</label>
                    <textarea id="notes" rows="2" placeholder="דגשים מיוחדים, כיתוב רצוי וכו'"></textarea>
                </div>

                <div class="price-box">
                    <span>סה"כ לתשלום:</span>
                    <span class="price-amount" id="total">55 ₪</span>
                </div>

                <button class="btn-order" onclick="order()">
                    <span>שלח הזמנה בוואטסאפ</span>
                    <span>✅</span>
                </button>

            </div>
        </div>

        <!-- אזור ביקורות -->
        <div class="reviews-container">
            <div class="reviews-header">
                <h2>ביקורות לקוחות 💬</h2>
                <div id="review-action-area">
                    <div class="review-lock-msg" id="review-lock-msg">🔒 כתיבת ביקורת מתאפשרת רק ללקוחות שביצעו הזמנה</div>
                    <button class="btn-review-add" id="btn-open-review-modal" style="display: none;" onclick="openReviewModal()">✍️ הוסף את הביקורת שלך על המוצר</button>
                </div>
            </div>

            <div class="reviews-list" id="reviews-list">
                <!-- הביקורות ייטענו מ-Firebase כאן -->
            </div>
        </div>

    </div>

    <!-- מודאל הדפסה על הגב -->
    <div class="modal-overlay" id="back-print-modal">
        <div class="modal">
            <h3>הדפסה על הגב (+15 ₪)</h3>
            <p style="color: var(--text-muted); margin: 0;">מה תרצה להדפיס על גב החולצה?</p>
            <textarea id="back-print-text" rows="3" placeholder="כתיבת טקסט, מספר, או תיאור של סמל..."></textarea>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-coupon" onclick="closeBackPrintModal(false)">ביטול</button>
                <button class="btn-review-add" onclick="closeBackPrintModal(true)">אישור</button>
            </div>
        </div>
    </div>

    <!-- מודאל הוספת ביקורת -->
    <div class="modal-overlay" id="add-review-modal">
        <div class="modal">
            <h3>הוסף ביקורת</h3>
            <div class="form-group">
                <label>שמך (יוצג בביקורת)</label>
                <input type="text" id="review-name-input" placeholder="ישראל ישראלי">
            </div>
            <div class="form-group">
                <label>דירוג</label>
                <select id="review-rating-select">
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                    <option value="3">⭐⭐⭐ (3/5)</option>
                </select>
            </div>
            <div class="form-group">
                <label>תוכן הביקורת</label>
                <textarea id="review-text-input" rows="3" placeholder="איך הייתה החולצה? האיכות? המשלוח?"></textarea>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-coupon" onclick="closeReviewModal()">ביטול</button>
                <button class="btn-review-add" onclick="submitReview()">פרסם ביקורת 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const PHONE_NUMBER = "972500000000"; // מספר הוואטסאפ לקבלת הזמנות
        const FIREBASE_DB_URL = "https://ashkenazi-shirts-default-rtdb.firebaseio.com/"; // כתובת הפרויקט ב-Firebase

        let basePrice = 55;
        let printExtra = 0;
        let shippingExtra = 0;
        let discount = 0;
        let deliveryMethod = 'pickup';
        let printType = 'front';
        let backPrintDetails = '';

        // טעינה ראשונית
        window.onload = function() {
            checkUserOrderPermission();
            fetchReviews();
        };

        // שינוי תמונה ראשית בגלריה
        function changeImage(el) {
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('main-img').src = el.src;
        }

        // שינוי אופן אספקה
        function setDelivery(method) {
            deliveryMethod = method;
            document.getElementById('btn-pickup').classList.toggle('active', method === 'pickup');
            document.getElementById('btn-shipping').classList.toggle('active', method === 'shipping');
            
            let addressGroup = document.getElementById('address-group');
            if (method === 'shipping') {
                addressGroup.style.display = 'flex';
                shippingExtra = 35;
            } else {
                addressGroup.style.display = 'none';
                shippingExtra = 0;
            }
            calculateTotal();
        }

        // שינוי סוג הדפסה
        function setPrintType(type) {
            printType = type;
            document.getElementById('btn-print-front').classList.toggle('active', type === 'front');
            document.getElementById('btn-print-back').classList.toggle('active', type === 'back');

            if (type === 'front') {
                printExtra = 0;
